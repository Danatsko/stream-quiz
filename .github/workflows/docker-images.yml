name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      build_backend:
        description: 'Build Backend Image'
        required: true
        type: boolean
        default: false
      build_frontend:
        description: 'Build Frontend Image'
        required: true
        type: boolean
        default: false
        
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.fallback.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.fallback.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
            
      - name: Detect changed paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
              
      - name: Set fallback outputs
        if: github.event_name == 'workflow_dispatch'
        id: fallback
        run: |
          echo "backend=false" >> $GITHUB_OUTPUT
          echo "frontend=false" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changes
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            changed: ${{ needs.detect-changes.outputs.backend }}
            manual_trigger: ${{ inputs.build_backend || false }}
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            changed: ${{ needs.detect-changes.outputs.frontend }}
            manual_trigger: ${{ inputs.build_frontend || false }}
    steps:
      - name: Check if build is needed
        id: gate
        run: |
          if [[ "${{ matrix.changed }}" == "true" ]]; then
            echo "need_run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                  "${{ matrix.manual_trigger }}" == "true" ]]; then
            echo "need_run=true" >> $GITHUB_OUTPUT
          else
            echo "need_run=false" >> $GITHUB_OUTPUT
          fi
    
      - name: Validate secrets
        if: steps.gate.outputs.need_run == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::DOCKERHUB_USERNAME is not set"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_TOKEN is not set"
            exit 1
          fi
    
      - name: Checkout code
        if: steps.gate.outputs.need_run == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.gate.outputs.need_run == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.need_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.need_run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Environment Suffix and Tags
        if: steps.gate.outputs.need_run == 'true'
        id: image_vars
        run: |
          branch_name="${GITHUB_REF_NAME}"
          if [[ "$branch_name" == "main" ]]; then
            echo "env_suffix=prod" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "$branch_name" == "dev" ]]; then
            echo "env_suffix=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          else
            echo "Branch $branch_name not configured. Exiting."
            exit 1
          fi
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.gate.outputs.need_run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/stream_quiz_${{ matrix.service }}_${{ steps.image_vars.outputs.env_suffix }}:${{ steps.image_vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/stream_quiz_${{ matrix.service }}_${{ steps.image_vars.outputs.env_suffix }}:${{ steps.image_vars.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.image_vars.outputs.env_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ steps.image_vars.outputs.env_suffix }}