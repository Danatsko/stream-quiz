name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      build_backend:
        description: 'Build Backend Image'
        required: true
        type: boolean
        default: false
      build_frontend:
        description: 'Build Frontend Image'
        required: true
        type: boolean
        default: false
        
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            changed: ${{ needs.detect-changes.outputs.backend }}
            manual_trigger: ${{ inputs.build_backend }}
          - service: frontend
            changed: ${{ needs.detect-changes.outputs.frontend }}
            manual_trigger: ${{ inputs.build_frontend }}
    steps:
      - name: Checkout code
        if: ${{ matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && matrix.manual_trigger == true) }}
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: ${{ matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && matrix.manual_trigger == true) }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && matrix.manual_trigger == true) }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && matrix.manual_trigger == true) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Environment Suffix and Tags
        if: ${{ matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && matrix.manual_trigger == true) }}
        id: image_vars
        run: |
          branch_name="${GITHUB_REF_NAME}"
          if [[ "$branch_name" == "main" ]]; then
            echo "env_suffix=prod" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "$branch_name" == "dev" ]]; then
            echo "env_suffix=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
          else
            echo "Branch $branch_name not configured. Exiting."
            exit 1
          fi
        shell: bash

      - name: Build and push
        if: ${{ matrix.changed == 'true' || (github.event_name == 'workflow_dispatch' && matrix.manual_trigger == true) }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            danatsko/${{ matrix.service }}_${{ steps.image_vars.outputs.env_suffix }}:${{ steps.image_vars.outputs.tag }}
            danatsko/${{ matrix.service }}_${{ steps.image_vars.outputs.env_suffix }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ steps.image_vars.outputs.env_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ steps.image_vars.outputs.env_suffix }}