[project]
name = "backend"
version = "0.1.0"
description = "Backend for StreamQuiz."
authors = [
    {name = "Oleksandr Danatsko", email = "oleksandrdanatsko@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = [
    "alembic>=1.18.1",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[crypto]>=2.10.1",
    "redis>=7.1.0",
    "resend>=2.29.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    {include-group = "lint"}
]
lint = [
    "ruff>=0.14.14",
]
